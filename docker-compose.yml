version: "3.8"

services:
  assistente-virtual:
    image: node:20-alpine
    container_name: assistente-virtual
    restart: unless-stopped
    working_dir: /app
    command: sh -c "npm install --production --silent --no-audit --no-fund && node app.js"
    env_file: .env
    volumes:
      - /home/user/nodejs:/app
    networks:
      - hairtech-network
      - web
    extra_hosts:
      - "host.docker.internal:host-gateway"
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=web"
      - "traefik.http.routers.av.rule=Host(`hairtech.org`) && (PathPrefix(`/webhook`) || PathPrefix(`/health`) || PathPrefix(`/comprovantes`) || PathPrefix(`/historico`) || PathPrefix(`/admin`) || PathPrefix(`/status`) || PathPrefix(`/nfse`))"
      - "traefik.http.routers.av.entrypoints=websecure"
      - "traefik.http.routers.av.tls.certresolver=letsencrypt"
      - "traefik.http.routers.av.priority=300"
      - "traefik.http.services.av.loadbalancer.server.port=3001"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

networks:
  hairtech-network:
    external: true
  web:
    external: true
