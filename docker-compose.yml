version: "3.8"

services:
  assistente-virtual:
    image: node:20-alpine
    container_name: assistente-virtual
    restart: unless-stopped
    working_dir: /app
    command: sh -c "npm install --production && node app.js"
    env_file: .env
    volumes:
      - /home/user/nodejs:/app
    networks:
      - hairtech-network
      - web
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.av.rule=Host(`hairtech.org`) && PathPrefix(`/webhook`,`/health`,`/comprovantes`,`/historico`,`/admin`,`/status`,`/nfse`)"
      - "traefik.http.services.av.loadbalancer.server.port=3001"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/health"]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  hairtech-network:
    external: true
  web:
    external: true
